name: BotBouncer

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Minimal permissions -- read repo content only, no write access
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # Secrets are never available to forked PRs by default.
    # This condition prevents the job from silently failing with missing secrets.
    if: ${{ github.repository_owner == github.actor || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          missing=0
          for var in REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET REDDIT_USERNAME REDDIT_PASSWORD MONITOR_SUBS; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "See README for setup instructions."
            exit 1
          fi
          echo "All required secrets present."
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          MONITOR_SUBS: ${{ secrets.MONITOR_SUBS }}

      - name: Restore seen-comment cache
        uses: actions/cache@v4
        with:
          path: seen_comments.txt
          # Fixed key so the same entry is restored and saved on every run.
          # actions/cache always saves on cache miss; on hit it skips save.
          # Use a date-bucketed key so the cache refreshes weekly (avoids
          # unbounded growth if we ever store more data here).
          key: seen-comments-${{ github.run_number }}
          restore-keys: seen-comments-

      - name: Run poll
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: BotBouncer/1.0
          MONITOR_SUBS: ${{ secrets.MONITOR_SUBS }}
          SCORE_THRESHOLD: ${{ vars.SCORE_THRESHOLD || '20' }}
        run: python poll.py
